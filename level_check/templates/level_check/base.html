<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Speaking Level Check Test{% endblock %}</title>
  <link rel="manifest" href="{% block manifest_href %}{{ url_for('level_check.web_app_manifest') }}{% endblock %}">
  <link rel="apple-touch-icon" href="{{ url_for('level_check.static', filename='icons/apple-touch-icon.png', v='20260923a') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('level_check.static', filename='icons/favicon-32x32.png', v='20260923a') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('level_check.static', filename='icons/favicon-16x16.png', v='20260923a') }}">
  <meta name="theme-color" content="#1A4B8C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{% block pwa_short_name %}Level Check{% endblock %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('level_check.static', filename='css/style.css', v='20260826a') }}">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#0284c7', dark: '#0369a1', light: '#38bdf8' },
          }
        }
      }
    }
  </script>
  <style>
    .lc-bg-image {
      background-image: url("{{ url_for('static', filename=background_image or 'news/images/nature-bg.jpg') }}");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="relative min-h-screen text-slate-800 antialiased">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div id="lc-bg-image-layer" class="lc-bg-image absolute inset-0 scale-105"
      style="opacity: {{ '%.2f'|format(background_opacity if background_opacity is not none else 0.35) }};"></div>
    <div class="absolute inset-0 lc-page-bg"></div>
  </div>

  <header class="lc-glass-header sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('level_check.index') }}" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-brand flex items-center justify-center text-white text-lg font-bold shadow">S</div>
        <div>
          <h1 class="text-base font-bold text-brand-dark leading-tight">Speaking Level Check Test</h1>
          <p class="text-xs text-slate-500">瞬発力・運用力レベルチェック</p>
        </div>
      </a>
      <div class="flex items-center gap-2">
        {% block header_actions %}{% endblock %}
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 pb-16">
    {% block body %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
