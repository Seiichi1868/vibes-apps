<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}Speaking Lab Trigger{% endblock %}</title>
  <link rel="manifest" href="{% block manifest_href %}{{ url_for('trigger.web_app_manifest') }}{% endblock %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='trigger/icons/favicon-32x32.png', v='20260923a') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='trigger/icons/favicon-16x16.png', v='20260923a') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='trigger/icons/apple-touch-icon.png', v='20260923a') }}">
  <meta name="theme-color" content="#5FB8D8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{% block pwa_short_name %}Trigger{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 吹き出しアイコンと同じパステル（ピンク → パープル → ブルー → ティール） */
    body { font-family: 'Outfit', system-ui, sans-serif; }
    .page-bg {
      background:
        radial-gradient(circle at 8% 6%, rgba(244, 168, 204, 0.55), transparent 40%),
        radial-gradient(circle at 34% 16%, rgba(201, 160, 220, 0.42), transparent 42%),
        radial-gradient(circle at 74% 10%, rgba(130, 176, 230, 0.38), transparent 40%),
        radial-gradient(circle at 94% 88%, rgba(94, 210, 214, 0.42), transparent 48%),
        linear-gradient(150deg, #fdeef6 0%, #f4e9fb 32%, #eaf3fc 64%, #e7f8f8 100%);
    }
    .glass {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(214, 176, 228, 0.7);
      box-shadow: 0 8px 32px rgba(122, 90, 176, 0.1), 0 1px 0 rgba(255, 255, 255, 0.75) inset;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(196, 168, 226, 0.58);
      box-shadow: 0 10px 40px rgba(92, 74, 160, 0.1), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }
    .glass-inset {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(201, 176, 230, 0.5);
    }
    .trig-brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 22%;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(138, 106, 208, 0.32);
    }
    .trig-intro-logo {
      width: 96px;
      height: 96px;
      border-radius: 22%;
      object-fit: cover;
      display: block;
      margin: 0 auto 14px;
      box-shadow:
        0 8px 24px rgba(138, 106, 208, 0.32),
        0 2px 6px rgba(95, 184, 216, 0.22);
    }
    .compact-input {
      border-radius: 0.5rem;
      border: 1px solid rgba(214, 186, 232, 0.95);
      background: rgba(255, 255, 255, 0.88);
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      color: rgb(30 41 59);
      box-shadow: 0 1px 2px rgba(92, 74, 160, 0.04);
      width: 100%;
    }
    .compact-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(138, 106, 208, 0.45);
      border-color: #b48ad4;
    }
    .compact-btn {
      border-radius: 0.6rem;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(105deg, #d16aa8 0%, #8a6ad0 42%, #4a96d0 78%, #3eb4cc 100%);
      box-shadow: 0 4px 14px rgba(138, 106, 208, 0.32);
      transition: filter 0.15s, transform 0.1s;
    }
    .compact-btn:hover { filter: brightness(1.06); }
    .compact-btn:active { transform: scale(0.98); }
    .compact-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
    .compact-btn-outline {
      border-radius: 0.6rem;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #5c4a96;
      background: rgba(255,255,255,0.74);
      border: 1px solid rgba(176, 140, 214, 0.75);
    }
    .compact-btn-outline:hover { background: rgba(244, 232, 252, 0.85); }
    .brand-title {
      background: linear-gradient(100deg, #c45a98, #7a56c0, #3d8ec4, #2aa8bc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .accent-heading { color: #4a3e86; }
    .accent-label { color: rgba(90, 74, 150, 0.9); }
    .accent-strong { color: #5a4a96; }
    .accent-good { color: #1c8c9c; }
    .accent-blue { color: #3a90c0; }
    .accent-row { border-bottom: 1px solid rgba(201, 160, 220, 0.45); }
    .is-selected { outline: 2px solid #8a6ad0; outline-offset: 1px; }
    .theme-card:hover { border-color: #c9a0dc; }
    .step-dot {
      width: 0.55rem; height: 0.55rem; border-radius: 999px;
      background: rgba(168, 150, 190, 0.45);
    }
    .step-dot.active { background: #8a6ad0; }
    .step-dot.done { background: #5fb8d8; }
    .rec-dot {
      width: 0.6rem; height: 0.6rem; border-radius: 999px; background: #ef4444;
      animation: recPulse 1.1s ease-in-out infinite;
    }
    @keyframes recPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(138, 106, 208, 0.4); border-radius: 999px; }
    @media (min-width: 640px) {
      .trig-intro-logo { width: 112px; height: 112px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="relative min-h-screen text-slate-800 antialiased">
  <div class="page-bg fixed inset-0 -z-10"></div>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
