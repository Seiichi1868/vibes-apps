{% extends "toolbox/base.html" %}
{% block title %}ログイン · Toolbox{% endblock %}
{% block body %}
<section class="tb-card tb-narrow">
  <h1>Toolbox にログイン</h1>
  <p class="tb-lead">教員用の授業補助ツールです。アカウントは管理者が発行します。</p>
  {% if error %}<p class="tb-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="tb-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>ユーザー名
      <input name="username" autocomplete="username" required>
    </label>
    <label>パスワード
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="tb-btn tb-btn-primary" type="submit">ログイン</button>
  </form>
</section>
{% endblock %}
