<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>オフライン · Toolbox</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #e9efdf;
      color: #2b2b2b;
    }
    main {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 16px;
      padding: 0 16px;
      border-radius: 999px;
      background: #7cb342;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>オフラインです</h1>
    <p>ネットワークに接続してから、もう一度開いてください。</p>
    <a href="/toolbox/">Toolbox を開く</a>
  </main>
</body>
</html>
