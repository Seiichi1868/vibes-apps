{% extends "toolbox/base.html" %}
{% block title %}ランダム座席表 · Toolbox{% endblock %}
{% block body %}
<section class="tb-tool tb-stage-tool" data-display-root>
  <div class="tb-stage-chrome tb-stage-chrome-top">
    <h1 class="tb-tool-title">ランダム座席表</h1>
    <div class="tb-inline-form">
      <label>クラス
        <select id="tb-class"></select>
      </label>
      <button class="tb-btn" type="button" id="tb-class-new">新規</button>
      <button class="tb-btn" type="button" id="tb-class-edit">編集</button>
      <button class="tb-btn" type="button" id="tb-class-dup">複製</button>
      <button class="tb-btn" type="button" id="tb-class-del">削除</button>
    </div>
    <p class="tb-note">氏名は使いません。欠席は番号をタップ。席数は人数以上にしてください。</p>
    <div id="tb-grid" class="tb-grid"></div>
    <div class="tb-inline-form">
      <label>行
        <input id="tb-rows" type="number" min="1" max="12" value="6">
      </label>
      <label>列
        <input id="tb-cols" type="number" min="1" max="12" value="5">
      </label>
      <button class="tb-btn tb-btn-primary" type="button" id="tb-shuffle">配置する</button>
      <button class="tb-btn" type="button" id="tb-clear">全リセット</button>
      <button class="tb-btn" type="button" data-display-enter>表示モード</button>
    </div>
  </div>
  <div class="tb-stage-main tb-seat-stage">
    <p class="tb-seat-edge" aria-hidden="true">Front</p>
    <div id="tb-seats" class="tb-seat-board" role="grid" aria-label="座席表"></div>
    <p class="tb-seat-edge" aria-hidden="true">Back</p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>window.TOOLBOX_CLASSES = {{ classes|tojson }};</script>
<script src="{{ url_for('static', filename='toolbox/js/random_seats.js', v=toolbox_cache) }}"></script>
{% endblock %}
