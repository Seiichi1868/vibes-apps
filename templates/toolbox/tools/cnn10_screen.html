{% extends "toolbox/base.html" %}
{% block title %}News Talk · Toolbox{% endblock %}
{% block body_class %}tb-screen-page{% endblock %}
{% block head %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body.tb-screen-page {
    height: 100%;
    overflow: hidden;
    padding: 0;
    background: #0f172a;
  }
  body.tb-screen-page .tb-top,
  body.tb-screen-page .tb-blank-btn,
  body.tb-screen-page #tb-blank { display: none; }
  body.tb-screen-page .tb-main {
    width: 100%;
    max-width: none;
    margin: 0;
    height: 100%;
  }
  .tb-screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    color: #f8fafc;
    font-family: "Outfit", system-ui, sans-serif;
  }
  .tb-screen-stage { position: absolute; inset: 0; overflow: auto; }
  .tb-screen.is-video .tb-screen-stage { overflow: hidden; background: #000; }
  .tb-screen-stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
  .tb-screen-bar {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
    max-width: min(100% - 16px, 28rem);
    padding: 3px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.28);
  }
  .tb-screen.is-video .tb-screen-bar { bottom: 52px; }
  .tb-screen-bar button {
    min-height: 0;
    min-width: 0;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(51, 65, 85, 0.72);
    color: #e2e8f0;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
  }
  .tb-screen-bar button.is-on {
    background: #0e7490;
    color: #fff;
    border-color: rgba(45, 212, 191, 0.45);
  }
  .tb-screen-copy {
    padding: clamp(16px, 3vw, 40px);
  }
  .tb-screen-copy h2 { margin: 0 0 12px; font-size: clamp(0.95rem, 2vw, 1.5rem); }
  .screen-warmup-inner {
    width: 100%;
    max-width: 96vw;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
    position: relative;
  }
  .screen-view--warmup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: stretch;
    align-items: stretch;
    padding: clamp(0.75rem, 2.5vmin, 2rem);
    overflow: auto;
    touch-action: none;
  }
  .screen-warmup-heading {
    flex-shrink: 0;
    margin: 0 0 clamp(0.75rem, 2.5vh, 1.75rem);
    font-size: clamp(0.95rem, 2vw, 1.5rem);
    font-weight: 600;
    color: #7dd3fc;
    line-height: 1.3;
  }
  .screen-warmup-q {
    display: flex;
    align-items: flex-start;
    gap: 0.35em;
    font-size: var(--warmup-q-size, clamp(0.95rem, 2vw, 1.5rem));
    line-height: 1.32;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .screen-warmup-num {
    color: #38bdf8;
    font-weight: 700;
    font-size: 1em;
    min-width: 2.2em;
    flex-shrink: 0;
  }
  .screen-warmup-text { flex: 1; min-width: 0; }
  .screen-qa-current {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }
  .screen-qa-waiting {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    color: rgba(148, 163, 184, 0.3);
    font-size: clamp(0.72rem, 1.45vmin, 0.95rem);
    font-weight: 500;
    text-align: center;
  }
  .screen-postview-answer {
    flex: 0 0 auto;
    min-height: calc(var(--warmup-q-size, 2rem) * 1.35);
    margin: 0.45em 0 0 1.98em;
    color: #fcd34d;
    font-size: var(--warmup-q-size, clamp(0.95rem, 2vw, 1.5rem));
    font-weight: 500;
    line-height: 1.32;
  }
  .screen-postview-answer-label { font-weight: 700; margin-right: 0.35em; }
  .screen-postview-hint {
    position: absolute;
    left: 50%;
    bottom: 0.85rem;
    transform: translateX(-50%);
    margin: 0;
    font-size: clamp(0.75rem, 1.6vmin, 1rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(253, 230, 138, 0.8);
    pointer-events: none;
    white-space: nowrap;
  }
  .screen-writing-item {
    display: flex;
    flex-direction: column;
    gap: 0.25em;
    font-size: var(--warmup-q-size, clamp(0.95rem, 2vw, 1.5rem));
  }
  .screen-writing-choices {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4em;
    margin-left: 2.75em;
    font-size: 1em;
  }
  .screen-writing-choice {
    border: 2px solid rgba(251, 113, 133, 0.7);
    border-radius: 999px;
    padding: 0.05em 0.7em;
    color: #fecdd3;
    font-weight: 700;
  }
  .screen-writing-or { color: rgba(148, 163, 184, 0.9); font-weight: 600; }
  .screen-writing-ja {
    margin-left: 3.6em;
    font-size: 1em;
    color: rgba(203, 213, 225, 0.85);
    line-height: 1.4;
  }
  .screen-writing-oreo {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(0.3rem, 1vmin, 0.75rem);
    margin-top: clamp(0.5rem, 2vh, 1.25rem);
    font-size: clamp(0.95rem, 2vw, 1.5rem);
  }
  .screen-writing-oreo-step {
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 0.6rem;
    padding: 0.2em 0.7em;
    color: #e0f2fe;
  }
  .screen-writing-oreo-step b { color: #38bdf8; margin-right: 0.3em; }
  .screen-writing-oreo-arrow { color: rgba(148, 163, 184, 0.8); }
  .screen-writing-oreo-words { color: #fda4af; font-weight: 700; margin-left: 0.5em; }
  .tb-vocab {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(0.95rem, 2vw, 1.5rem);
  }
  .tb-vocab th, .tb-vocab td {
    text-align: left;
    vertical-align: top;
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid rgba(51, 65, 85, 0.7);
  }
  .tb-vocab th {
    font-size: 1em;
    letter-spacing: 0.06em;
    color: rgba(148, 163, 184, 0.9);
  }
  .tb-vocab .word { color: #fbbf24; font-weight: 700; white-space: nowrap; }
  .tb-wait { color: #94a3b8; font-size: clamp(0.95rem, 2vw, 1.5rem); }
  #screen-status {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 5;
    margin: 0;
    font-size: 12px;
    color: rgba(226, 232, 240, 0.75);
  }
</style>
{% endblock %}
{% block body %}
<section class="tb-screen is-video" id="cnn10-screen" data-archive="{{ archive_id }}">
  <div class="tb-screen-stage" id="screen-stage"></div>
  <p id="screen-status"></p>
  <div class="tb-screen-bar" id="screen-controls">
    <button type="button" data-view="video">動画</button>
    <button type="button" data-view="vocab">語彙</button>
    <button type="button" data-view="warmup">Warm-up</button>
    <button type="button" data-view="discussion">Discussion</button>
    <button type="button" data-view="writing">Writing</button>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='toolbox/js/cnn10_screen.js', v=toolbox_cache) }}"></script>
{% endblock %}
