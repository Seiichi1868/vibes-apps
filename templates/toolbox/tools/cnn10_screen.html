{% extends "toolbox/base.html" %}
{% block title %}CNN10スクリーン · Toolbox{% endblock %}
{% block head %}
<style>
  .tb-screen { max-width: 960px; margin: 0 auto; }
  .tb-screen h1, .tb-screen h2 { line-height: 1.3; }
  .tb-screen p, .tb-screen li { font-size: 1.35rem; line-height: 1.6; }
  .tb-screen iframe { border: 0; border-radius: 12px; background: #000; }
</style>
{% endblock %}
{% block body_class %}tb-display{% endblock %}
{% block body %}
<section class="tb-screen" id="cnn10-screen">
  <p class="tb-muted" id="screen-status">読み込み中…</p>
  <h1 id="screen-title"></h1>
  <div id="screen-video"></div>
  <div id="screen-body"></div>
  <p class="tb-note">クリックまたは ↓ で次へ。↑ で戻る。</p>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='toolbox/js/cnn10_screen.js', v=toolbox_cache) }}"></script>
{% endblock %}
