{% extends "toolbox/base.html" %}
{% block title %}News Talk · Toolbox{% endblock %}
{% block body_class %}tb-screen-page{% endblock %}
{% block head %}
<style>
  html, body.tb-screen-page {
    height: 100%;
    overflow: hidden;
    padding: 0;
    background: #0f172a;
  }
  body.tb-screen-page .tb-top,
  body.tb-screen-page .tb-blank-btn,
  body.tb-screen-page #tb-blank { display: none; }
  body.tb-screen-page .tb-main {
    width: 100%;
    max-width: none;
    margin: 0;
    height: 100%;
  }
  .tb-screen { position: fixed; inset: 0; background: #0f172a; color: #f8fafc; }
  .tb-screen-stage { position: absolute; inset: 0; overflow: auto; }
  .tb-screen.is-video .tb-screen-stage { overflow: hidden; background: #000; }
  .tb-screen-stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
  .tb-screen-bar {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 4px;
    max-width: min(100% - 16px, 28rem);
    padding: 3px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.28);
  }
  .tb-screen.is-video .tb-screen-bar { bottom: 52px; }
  .tb-screen-bar button {
    min-height: 0;
    min-width: 0;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(51, 65, 85, 0.72);
    color: #e2e8f0;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
  }
  .tb-screen-bar button.is-on {
    background: #0e7490;
    color: #fff;
    border-color: rgba(45, 212, 191, 0.45);
  }
  .tb-screen-copy {
    padding: clamp(16px, 3vw, 40px);
  }
  .tb-screen-copy h2 { margin: 0 0 12px; font-size: clamp(1.4rem, 3vw, 2.2rem); }
  .tb-qa { position: absolute; inset: 0; }
  .tb-qa-label {
    position: absolute;
    top: 8px;
    left: 10px;
    margin: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(148, 163, 184, 0.75);
  }
  .tb-qa-top, .tb-qa-bottom {
    position: absolute;
    left: 8vw;
    right: 8vw;
    display: flex;
    justify-content: center;
  }
  .tb-qa-top { bottom: 50%; padding-bottom: 0.2rem; align-items: flex-end; }
  .tb-qa-bottom { top: 50%; padding-top: 0.2rem; align-items: flex-start; }
  .tb-qa-text {
    margin: 0;
    max-width: 92vw;
    font-size: clamp(2.4rem, 6.2vw, 5.4rem);
    line-height: 1.25;
    font-weight: 700;
    text-align: center;
  }
  .tb-qa-hint {
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 3rem);
    line-height: 1.3;
    font-weight: 700;
    color: #e2e8f0;
    text-align: center;
  }
  .tb-vocab {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(1rem, 2.2vw, 1.7rem);
  }
  .tb-vocab th, .tb-vocab td {
    text-align: left;
    vertical-align: top;
    padding: 0.55rem 0.8rem;
    border-bottom: 1px solid rgba(51, 65, 85, 0.7);
  }
  .tb-vocab th {
    font-size: 0.55em;
    letter-spacing: 0.06em;
    color: rgba(148, 163, 184, 0.9);
  }
  .tb-vocab .word { color: #fbbf24; font-weight: 700; white-space: nowrap; }
  .tb-wait { color: #94a3b8; font-size: 1.3rem; }
  #screen-status {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 5;
    margin: 0;
    font-size: 12px;
    color: rgba(226, 232, 240, 0.75);
  }
</style>
{% endblock %}
{% block body %}
<section class="tb-screen is-video" id="cnn10-screen" data-archive="{{ archive_id }}">
  <div class="tb-screen-stage" id="screen-stage"></div>
  <p id="screen-status"></p>
  <div class="tb-screen-bar" id="screen-controls">
    <button type="button" data-view="video">動画</button>
    <button type="button" data-view="vocab">語彙</button>
    <button type="button" data-view="warmup">Warm-up</button>
    <button type="button" data-view="discussion">Discussion</button>
    <button type="button" data-view="writing">Writing</button>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='toolbox/js/cnn10_screen.js', v=toolbox_cache) }}"></script>
{% endblock %}
