{% extends "toolbox/base.html" %}
{% block title %}CNN10スクリーン · Toolbox{% endblock %}
{% block body_class %}tb-display{% endblock %}
{% block head %}
<style>
  .tb-screen-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tb-screen-bar button.is-on { background: var(--tb-accent); color: #fff; }
  .tb-screen-stage { min-height: 60vh; }
  .tb-screen-stage h1, .tb-screen-stage h2 { font-size: clamp(1.6rem, 4vw, 2.6rem); }
  .tb-screen-stage .tb-q { font-size: clamp(1.8rem, 5vw, 3.4rem); line-height: 1.35; font-weight: 700; }
  .tb-screen-stage .tb-a { font-size: clamp(1.4rem, 3.5vw, 2.4rem); margin-top: 16px; }
  .tb-screen-stage iframe { width: 100%; aspect-ratio: 16/9; border: 0; background: #000; border-radius: 12px; }
  .tb-screen-stage li { font-size: clamp(1.3rem, 3vw, 2rem); margin: 8px 0; }
  .tb-wait { color: #64748b; font-size: 1.4rem; }
</style>
{% endblock %}
{% block body %}
<section class="tb-screen" id="cnn10-screen" data-archive="{{ archive_id }}">
  <div class="tb-screen-bar" id="screen-controls">
    <button class="tb-btn is-on" type="button" data-view="video">動画</button>
    <button class="tb-btn" type="button" data-view="vocab">語彙</button>
    <button class="tb-btn" type="button" data-view="warmup">ウォームアップ</button>
    <button class="tb-btn" type="button" data-view="discussion">ディスカッション</button>
    <button class="tb-btn" type="button" data-view="writing">書く</button>
  </div>
  <p class="tb-muted" id="screen-status"></p>
  <div class="tb-screen-stage" id="screen-stage"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='toolbox/js/cnn10_screen.js', v=toolbox_cache) }}"></script>
{% endblock %}
