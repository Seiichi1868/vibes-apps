{% extends "toolbox/base.html" %}
{% block title %}QRコード · Toolbox{% endblock %}
{% block body %}
<section class="tb-tool tb-qr tb-stage-tool" data-display-root>
  <div class="tb-stage-chrome tb-stage-chrome-top">
    <h1 class="tb-tool-title">QRコード</h1>
    <p class="tb-note">URLを貼るとすぐ大きなQRが出ます。教室のスクリーンに出して、生徒に読み取ってもらえます。</p>
    <form class="tb-qr-form" id="tb-qr-form" action="#" method="get">
      <label class="tb-qr-url-label">URL
        <input id="tb-qr-input" type="text" inputmode="url" autocomplete="url" spellcheck="false" autocapitalize="off" placeholder="https://vibes-app-auz1.onrender.com/debate" aria-describedby="tb-qr-status">
      </label>
      <div class="tb-actions">
        <button class="tb-btn tb-btn-primary" type="submit" id="tb-qr-make">QRを出す</button>
        <button class="tb-btn" type="button" id="tb-qr-copy">リンクをコピー</button>
        <a class="tb-btn" id="tb-qr-download" hidden download="qr.png">画像を保存</a>
        <button class="tb-btn" type="button" data-display-enter>大きく表示</button>
      </div>
    </form>
    <p class="tb-muted" id="tb-qr-status" role="status">URLを入力または貼り付けるとQRコードが出ます。</p>
  </div>
  <div class="tb-stage-main">
    <div class="tb-qr-stage" id="tb-qr-stage">
      <p class="tb-qr-empty" id="tb-qr-empty">URLを貼るとここにQRコードが出ます</p>
      <button class="tb-qr-frame" id="tb-qr-frame" type="button" hidden aria-label="QRコードを大きく表示">
        <img id="tb-qr-image" class="tb-qr-image" alt="QRコード">
      </button>
      <p class="tb-qr-url" id="tb-qr-url" hidden></p>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='toolbox/js/qr.js', v=toolbox_cache) }}"></script>
{% endblock %}
