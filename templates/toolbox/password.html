{% extends "toolbox/base.html" %}
{% block title %}パスワード変更 · Toolbox{% endblock %}
{% block body %}
<section class="tb-card tb-narrow">
  <h1>パスワード変更</h1>
  {% if error %}<p class="tb-error" role="alert">{{ error }}</p>{% endif %}
  {% if ok_message %}<p class="tb-ok" role="status">{{ ok_message }}</p>{% endif %}
  <form method="post" class="tb-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>いまのパスワード
      <input name="current_password" type="password" required>
    </label>
    <label>新しいパスワード（4文字以上）
      <input name="new_password" type="password" minlength="4" required>
    </label>
    <label>新しいパスワード（確認）
      <input name="confirm_password" type="password" minlength="4" required>
    </label>
    <button class="tb-btn tb-btn-primary" type="submit">変更する</button>
  </form>
</section>
{% endblock %}
