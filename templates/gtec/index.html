<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTEC Speaking アプリ</title>
  <link rel="manifest" href="{{ url_for('gtec.web_app_manifest') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='gtec/icons/favicon-32x32.png', v='20260923a') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='gtec/icons/favicon-16x16.png', v='20260923a') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='gtec/icons/apple-touch-icon.png', v='20260923a') }}">
  <meta name="theme-color" content="#5FCDA8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GTEC Speaking">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='gtec/css/style.css', v='20260923c') }}">
  <style>
    .gtec-page-bg {
      background-image: url("{{ url_for('static', filename=background.background_image) }}");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#2db892', dark: '#0f766e', light: '#7EE0C3' }
          }
        }
      }
    }
  </script>
</head>
<body class="relative min-h-screen text-slate-800 antialiased">

  <!-- オープニング -->
  <div id="opening-overlay"
    class="fixed inset-0 z-[70] flex items-center justify-center overflow-hidden bg-gradient-to-br from-emerald-50 via-white to-teal-50 p-6">
    <div class="gtec-page-bg absolute inset-0 scale-110 opacity-[0.45]"></div>
    <div class="absolute inset-0 bg-gradient-to-br from-white/70 via-emerald-50/55 to-teal-50/65"></div>
    <div class="absolute inset-0 bg-white/20"></div>
    <div class="gtec-intro-orb absolute -left-16 top-14 h-48 w-48 rounded-full bg-teal-200/50 blur-3xl"></div>
    <div class="gtec-intro-orb absolute -right-12 bottom-16 h-56 w-56 rounded-full bg-emerald-200/50 blur-3xl" style="animation-delay: .35s"></div>
    <div class="gtec-intro-card relative text-center">
      <p class="gtec-intro-glass-label mb-2 text-[11px] font-semibold uppercase tracking-[0.35em]">Welcome to</p>
      <img class="gtec-intro-logo" src="{{ url_for('static', filename='gtec/icons/icon-192x192.png', v='20260923a') }}" width="192" height="192" alt="" decoding="async" aria-hidden="true">
      <h1 class="gtec-intro-title">GTEC Speaking</h1>
      <p class="gtec-intro-glass-sub mt-3 text-sm font-medium">Practice. Speak. Get instant scores.</p>
    </div>
  </div>

  <!-- 背景透かし（News と同様の自然風景） -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div id="page-bg-layer" class="gtec-page-bg absolute inset-0 scale-105" style="opacity: {{ background_opacity }}"></div>
    <div class="absolute inset-0 bg-gradient-to-br from-teal-100/70 via-white/55 to-emerald-100/70"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-emerald-50/40 via-transparent to-teal-50/35"></div>
  </div>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="glass-header sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img class="gtec-brand-logo" src="{{ url_for('static', filename='gtec/icons/icon-192x192.png', v='20260923a') }}" width="192" height="192" alt="" decoding="async" aria-hidden="true">
        <div>
          <h1 class="text-lg font-bold text-teal-700 leading-tight">GTEC Speaking</h1>
          <p class="text-xs text-slate-500">公式評価基準準拠 · 自動採点</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="stop-btn" type="button"
          class="hidden text-xs px-3 py-1.5 rounded-full bg-red-500 hover:bg-red-600 text-white font-semibold transition-colors shadow-sm">
          ■ 停止・やり直し
        </button>
        <div id="browser-badge" class="hidden text-xs px-2 py-1 rounded-full bg-emerald-100/90 text-emerald-700 font-medium">
          音声認識 OK
        </div>
      </div>
    </div>
  </header>

  <!-- ── No-support Banner ──────────────────────────────────── -->
  <div id="no-support-banner" class="hidden max-w-3xl mx-auto mt-4 px-4">
    <div class="glass-card rounded-xl p-4 flex gap-3 border-amber-200/80">
      <span class="text-amber-500 text-xl">⚠️</span>
      <div>
        <p class="font-semibold text-amber-800">このブラウザは音声認識に対応していません</p>
        <p class="text-sm text-amber-700 mt-1">
          <strong>Google Chrome</strong>（PC・Android）でアクセスしてください。
          Safariや Firefox では Web Speech API が使えません。
        </p>
      </div>
    </div>
  </div>

  <!-- ── Part Tabs ──────────────────────────────────────────── -->
  <nav class="max-w-3xl mx-auto px-4 mt-5">
    <div class="grid grid-cols-4 gap-1.5 glass-card rounded-2xl p-1.5">
      <button class="tab-btn" data-part="A">
        <span class="block font-bold text-sm">Part A</span>
        <span class="block text-xs opacity-75">音読</span>
      </button>
      <button class="tab-btn" data-part="B">
        <span class="block font-bold text-sm">Part B</span>
        <span class="block text-xs opacity-75">やり取り</span>
      </button>
      <button class="tab-btn" data-part="C">
        <span class="block font-bold text-sm">Part C</span>
        <span class="block text-xs opacity-75">ストーリー</span>
      </button>
      <button class="tab-btn" data-part="D">
        <span class="block font-bold text-sm">Part D</span>
        <span class="block text-xs opacity-75">意見表明</span>
      </button>
    </div>
  </nav>

  <!-- ── Main Content (JS-rendered) ────────────────────────── -->
  <main class="max-w-3xl mx-auto px-4 mt-5 pb-12" id="app-root"></main>

  <script src="{{ url_for('static', filename='gtec/js/app.js') }}"></script>
</body>
</html>
