<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Parliamentary Debate Practice{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='debate/css/style.css', v='20260919e') }}">
  <style>
    .debate-page-bg {
      background-image: url("{{ url_for('static', filename=background.background_image) }}");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gov: { DEFAULT: '#0d9488', light: '#ecfdf5', dark: '#115e59' },
            opp: { DEFAULT: '#e11d48', light: '#fff1f2', dark: '#9f1239' },
            brand: { DEFAULT: '#0d9488', dark: '#0f766e', light: '#2dd4bf' }
          }
        }
      }
    }
  </script>
  {% block head %}{% endblock %}
</head>
<body class="relative min-h-screen text-slate-800 antialiased">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div id="page-bg-layer" class="debate-page-bg absolute inset-0 scale-105" style="opacity: {{ background_opacity }}"></div>
    <div class="absolute inset-0 bg-gradient-to-br from-sky-100/75 via-white/55 to-emerald-100/70"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-emerald-50/40 via-transparent to-sky-50/30"></div>
  </div>

  <header class="glass-header sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('debate.index') }}" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-brand flex items-center justify-center text-white text-lg font-bold shadow">D</div>
        <div>
          <h1 class="text-sm sm:text-lg font-bold text-brand-dark leading-tight">Parliamentary Debate Practice</h1>
          <p class="text-xs text-slate-500">議会型ディベートを練習しよう</p>
        </div>
      </a>
      <div class="flex items-center gap-2">
        {% block header_actions %}{% endblock %}
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 pb-16">
    {% block body %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='debate/js/local-sessions.js', v='20260919a') }}"></script>
  <script src="{{ url_for('static', filename='debate/js/local-audio.js', v='20260919d') }}"></script>
</body>
</html>
