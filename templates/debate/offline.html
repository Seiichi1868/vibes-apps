<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>オフライン · Debate Practice</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Outfit", "Hiragino Sans", sans-serif;
      background: #e7f6f1;
      color: #1e293b;
    }
    main {
      width: min(420px, calc(100% - 32px));
      background: #fff;
      border-radius: 16px;

    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 16px;
      padding: 0 16px;
      border-radius: 999px;
      background: #0d9488;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>オフラインです</h1>
    <p>ネットワークに接続してから、もう一度開いてください。</p>
