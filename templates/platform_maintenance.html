<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メンテナンス中</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        color: #1a1a1a;
        background: linear-gradient(165deg, #eef2f8 0%, #f8fafc 55%, #fff 100%);
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 28px 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.1);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.05rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.75;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>メンテナンス中</h1>
      <p>{{ message }}</p>
    </div>
  </body>
</html>
