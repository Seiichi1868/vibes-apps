{% extends "news/base.html" %}
{% block title %}教室スクリーン — Speaking Lab News{% endblock %}

{% block head %}
<style>
  body { overflow: hidden; }
  .screen-root {
    background: #0f172a;
    color: #f8fafc;
  }
  .screen-view {
    position: absolute;
    inset: 0;
    display: none;
  }
  .screen-view.is-active {
    display: flex;
  }
  .screen-controls {
    position: absolute;
    z-index: 40;
    display: flex;
    flex-wrap: wrap;
    gap: 0.2rem;
    padding: 0.2rem 0.25rem;
    border-radius: 9999px;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(148, 163, 184, 0.25);
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  .screen-controls:hover,
  .screen-controls:focus-within {
    opacity: 0.95;
  }
  .screen-ctrl-btn {
    border-radius: 9999px;
    padding: 0.15rem 0.45rem;
    font-size: 0.625rem;
    font-weight: 600;
    line-height: 1.2;
    color: rgba(226, 232, 240, 0.9);
    background: rgba(51, 65, 85, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.2);
    transition: background 0.15s, color 0.15s;
  }
  .screen-ctrl-btn:hover {
    background: rgba(71, 85, 105, 0.85);
    color: #fff;
  }
  .screen-ctrl-btn.is-active {
    background: rgba(14, 116, 144, 0.85);
    border-color: rgba(45, 212, 191, 0.45);
    color: #fff;
  }
  .screen-ctrl-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .screen-class-label {
    position: absolute;
    top: 0.4rem;
    left: 0.5rem;
    z-index: 30;
    max-width: calc(100% - 6rem);
    font-size: 0.6rem;
    font-weight: 500;
    color: rgba(148, 163, 184, 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }
  .screen-vocab-table {
    width: 100%;
    max-width: 72rem;
    border-collapse: collapse;
    font-size: clamp(1rem, 2.2vw, 1.75rem);
  }
  .screen-vocab-table th {
    padding: 0.5rem 1rem 0.65rem;
    text-align: left;
    font-size: 0.55em;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(148, 163, 184, 0.85);
    border-bottom: 1px solid rgba(148, 163, 184, 0.25);
  }
  .screen-vocab-table td {
    padding: 0.65rem 1rem;
    border-bottom: 1px solid rgba(51, 65, 85, 0.6);
    vertical-align: top;
  }
  .screen-vocab-word {
    font-weight: 700;
    color: #fbbf24;
    white-space: nowrap;
  }
  .screen-vocab-pos {
    color: rgba(148, 163, 184, 0.8);
    font-size: 0.75em;
  }
  .screen-warmup-inner {
    width: 100%;
    max-width: 96vw;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }
  .screen-warmup-heading {
    flex-shrink: 0;
    margin-bottom: clamp(0.75rem, 2.5vh, 1.75rem);
    font-size: clamp(1.25rem, 3.2vmin, 2.25rem);
    font-weight: 600;
    color: #7dd3fc;
    line-height: 1.3;
  }
  .screen-warmup-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    gap: clamp(0.75rem, 2.5vh, 2rem);
    min-height: 0;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .screen-warmup-q {
    font-size: var(--warmup-q-size, clamp(1.75rem, 5vmin, 3.5rem));
    line-height: 1.32;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .screen-warmup-num {
    color: #38bdf8;
    font-weight: 700;
    font-size: 0.9em;
    min-width: 2.2em;
    flex-shrink: 0;
  }
  .screen-warmup-text {
    flex: 1;
    min-width: 0;
  }
  .screen-warmup-img-wrap {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    margin-bottom: clamp(0.5rem, 2vh, 1.25rem);
  }
  .screen-warmup-img-wrap img {
    max-height: var(--warmup-img-max-h, min(30vh, 20rem));
    width: auto;
    max-width: min(92vw, 48rem);
    border-radius: 0.75rem;
    object-fit: contain;
  }
  #view-postview.is-answer-pending {
    cursor: pointer;
  }
  .screen-postview-list {
    justify-content: space-evenly;
    gap: clamp(0.75rem, 2.5vh, 2rem);
  }
  .screen-postview-item {
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    justify-content: flex-start;
    min-height: min-content;
  }
  .screen-postview-answer {
    flex: 1 1 auto;
    min-height: calc(var(--warmup-q-size, 2rem) * 1.35);
    margin: 0.2em 0 0 1.98em;
    opacity: 0;
    color: #fcd34d;
    font-size: var(--warmup-q-size, 2rem);
    font-weight: 500;
    line-height: 1.32;
  }
  .screen-postview-answer.is-shown {
    animation: screen-postview-answer-in 0.55s ease forwards;
  }
  @keyframes screen-postview-answer-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .screen-postview-answer-label {
    font-weight: 700;
    margin-right: 0.35em;
  }
  .screen-postview-hint {
    position: absolute;
    left: 50%;
    bottom: 0.85rem;
    transform: translateX(-50%);
    margin: 0;
    font-size: clamp(0.75rem, 1.6vmin, 1rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(253, 230, 138, 0.8);
    pointer-events: none;
    white-space: nowrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .screen-postview-answer.is-shown {
      animation: none;
      opacity: 1;
    }
  }
  .screen-writing-item {
    display: flex;
    flex-direction: column;
    gap: 0.25em;
    font-size: var(--warmup-q-size, 2rem);
  }
  .screen-writing-choices {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4em;
    margin-left: 2.75em;
    font-size: 0.72em;
  }
  .screen-writing-choice {
    border: 2px solid rgba(251, 113, 133, 0.7);
    border-radius: 999px;
    padding: 0.05em 0.7em;
    color: #fecdd3;
    font-weight: 700;
  }
  .screen-writing-or {
    color: rgba(148, 163, 184, 0.9);
    font-weight: 600;
  }
  .screen-writing-answer-cue {
    color: #fcd34d;
    font-weight: 600;
  }
  .screen-writing-ja {
    margin-left: 3.6em;
    font-size: 0.55em;
    color: rgba(203, 213, 225, 0.85);
    line-height: 1.4;
  }
  .screen-writing-oreo {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: clamp(0.3rem, 1vmin, 0.75rem);
    margin-top: clamp(0.5rem, 2vh, 1.25rem);
    font-size: clamp(0.9rem, 2.4vmin, 1.6rem);
  }
  .screen-writing-oreo-step {
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 0.6rem;
    padding: 0.2em 0.7em;
    color: #e0f2fe;
  }
  .screen-writing-oreo-step b {
    color: #38bdf8;
    margin-right: 0.3em;
  }
  .screen-writing-oreo-arrow {
    color: rgba(148, 163, 184, 0.8);
  }
  .screen-writing-oreo-words {
    color: #fda4af;
    font-weight: 700;
    margin-left: 0.5em;
  }
  .screen-view--warmup {
    flex-direction: column;
    justify-content: stretch;
    align-items: stretch;
    padding: clamp(0.75rem, 2.5vmin, 2rem);
    overflow: auto;
  }
  #youtube-player-screen > iframe,
  #youtube-player-screen > div {
    width: 100% !important;
    height: 100% !important;
  }
</style>
{% endblock %}

{% block body %}
<div id="screen-app" class="screen-root fixed inset-0">
  <p id="screen-class-label" class="screen-class-label"></p>

  <div id="screen-loading" class="absolute inset-0 z-20 flex items-center justify-center text-sm text-slate-400" data-i18n="screenLoading">
    読み込み中…
  </div>
  <div id="screen-error" class="absolute inset-0 z-20 hidden items-center justify-center p-6 text-center text-sm text-red-300"></div>

  <div id="view-video" class="screen-view is-active flex-col">
    <div id="video-placeholder-screen" class="flex flex-1 items-center justify-center text-sm text-slate-500" data-i18n="screenNoVideo">
      動画が未設定です
    </div>
    <div id="youtube-player-screen" class="absolute inset-0 hidden [&>iframe]:h-full [&>iframe]:w-full [&>iframe]:border-0"></div>
  </div>

  <div id="view-vocab" class="screen-view items-center justify-center overflow-auto p-6 sm:p-10">
    <div id="vocab-content-screen" class="w-full"></div>
  </div>

  <div id="view-warmup" class="screen-view screen-view--warmup">
    <div id="warmup-content-screen" class="screen-warmup-inner"></div>
  </div>

  <div id="view-postview" class="screen-view screen-view--warmup">
    <div id="postview-content-screen" class="screen-warmup-inner"></div>
  </div>

  <div id="view-writing" class="screen-view screen-view--warmup">
    <div id="writing-content-screen" class="screen-warmup-inner"></div>
  </div>

  <div id="screen-controls" class="screen-controls bottom-2 right-2 sm:bottom-3 sm:right-3 hidden">
    <button type="button" class="screen-ctrl-btn" data-view="video" title="動画" data-i18n="screenVideo" data-i18n-title="screenVideo">動画</button>
    <button type="button" class="screen-ctrl-btn" data-view="vocab" title="単語" data-i18n="screenVocab" data-i18n-title="screenVocab" data-assistive-lang>単語</button>
    <button type="button" class="screen-ctrl-btn" data-view="warmup" title="導入質問" data-i18n="screenWarmup" data-i18n-title="screenWarmup">導入</button>
    <button type="button" class="screen-ctrl-btn" data-view="postview" title="事後質問" data-i18n="screenPostview" data-i18n-title="screenPostview">事後</button>
    <button type="button" class="screen-ctrl-btn" data-view="writing" title="ライティング" data-i18n="screenWriting" data-i18n-title="screenWriting">書く</button>
    <button type="button" id="screen-fullscreen-btn" class="screen-ctrl-btn" title="全画面" data-i18n-title="fullscreen">⛶</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.DISPLAY_LANGUAGE = {{ (display_language or 'ja')|tojson }};
  window.SCREEN_INITIAL_CLASS_ID = {{ initial_class_id|tojson }};
  window.SCREEN_CLASSES = {{ classes|tojson }};
</script>
<script src="{{ url_for('static', filename='news/js/i18n.js', v='20260926a') }}"></script>
<script src="{{ url_for('static', filename='news/js/screen.js', v='20260926a') }}"></script>
{% endblock %}
