<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaking Lab Pronounce - Temporarily Unavailable</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      .public-maintenance {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(160deg, #eef5ff 0%, #f7fbff 60%, #ffffff 100%);
        font-family: "Outfit", "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      .public-maintenance__card {
        max-width: 420px;
        width: 100%;
        padding: 32px 28px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        text-align: center;
      }
      .public-maintenance__icon {
        font-size: 2.4rem;
        margin-bottom: 8px;
      }
      .public-maintenance__title {
        margin: 0 0 12px;
        font-size: 1.2rem;
        font-weight: 800;
        color: #19324a;
      }
      .public-maintenance__message {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.7;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="public-maintenance">
      <section class="public-maintenance__card">
        <p class="public-maintenance__icon" aria-hidden="true">🛠️</p>
        <h1 class="public-maintenance__title">Temporarily Unavailable</h1>
        <p class="public-maintenance__message">
          The service is temporarily unavailable due to high traffic.<br />
          Please try again later.
        </p>
      </section>
    </main>
  </body>
</html>
