<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>確認コード</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: .4rem; font-size: .85rem; }
    h1 { font-size: 1rem; margin: 0 0 .3rem; }
    .box { border: 1px solid #e6e0d4; border-left: 5px solid #6b4c9a; border-radius: 8px; padding: .35rem .5rem; background: #f7f4fb; }
    input, button { font: inherit; padding: .15rem .4rem; }
    td { padding: .05rem .5rem .05rem 0; vertical-align: top; }
  </style>
</head>
<body>
  {% if not authed %}
    <h1>確認コード</h1>
    <form id="unlock">
      <label>管理パスワード<input id="password" type="password" required></label>
      <button type="submit">開く</button>
      <p id="err"></p>
    </form>
    <script>
      document.getElementById("unlock").onsubmit = async (event) => {
        event.preventDefault();
        const res = await fetch("/rec/admin/unlock", {
          method: "POST",
          headers: {"Content-Type": "application/json", "X-Speech-Rec-Request": "1"},
          body: JSON.stringify({password: document.getElementById("password").value}),
        });
        if (!res.ok) { document.getElementById("err").textContent = "パスワードが違います。"; return; }
        location.reload();
      };
    </script>
  {% else %}
    <h1>確認コード</h1>
    <form method="get" class="box">
      <input name="code" value="{{ code or '' }}" placeholder="K7M2-9QXA" autocomplete="off">
      <button type="submit">照合</button>
    </form>
    {% if missing %}<p>見つかりません。</p>{% endif %}
    {% if row %}
      <table>
        <tr><td>日時</td><td>{{ row.created_at }}</td></tr>
        <tr><td>お題</td><td>{{ row.topic }}</td></tr>
        <tr><td>試行</td><td>{{ row.attempt }}</td></tr>
        <tr><td>レベル</td><td>{{ row.levels }}</td></tr>
        <tr><td>点数</td><td>{{ row.scores }}</td></tr>
        <tr><td>フラグ</td><td>{{ row.flags }}</td></tr>
      </table>
    {% endif %}
  {% endif %}
</body>
</html>
