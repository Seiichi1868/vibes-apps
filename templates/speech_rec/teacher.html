<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出題</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: .4rem; color: #1c1915; font-size: .85rem; }
    h1 { font-size: 1rem; margin: 0 0 .3rem; }
    .box { border: 1px solid #e6e0d4; border-left: 5px solid #0b6e4f; border-radius: 8px; padding: .35rem .5rem; margin: .35rem 0; background: #f4faf6; }
    label { display: block; margin: .2rem 0; }
    label.sw { position: relative; display: flex; flex-direction: row; align-items: center; gap: .45rem; font-weight: 600; cursor: pointer; }
    label.sw input { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
    label.sw .track { display: block; width: 36px; height: 20px; border-radius: 999px; position: relative; flex: 0 0 36px; overflow: hidden; background: linear-gradient(180deg,#e8e8ed 0%,#c7c7cc 100%); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1.5px 2px rgba(0,0,0,.1); transition: background .42s cubic-bezier(.32,.72,0,1); }
    label.sw .track::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg,rgba(255,255,255,.42) 0%,transparent 52%); pointer-events: none; }
    label.sw .thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg,#fff 0%,#f6f6f8 52%,#e9e9ec 100%); box-shadow: 0 2px 5px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.05); transition: transform .42s cubic-bezier(.34,1.12,.64,1); }
    label.sw input:checked + .track { background: linear-gradient(180deg,#62e4bc 0%,#2db892 48%,#1f9a74 100%); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08), inset 0 1px 1px rgba(255,255,255,.38); }
    label.sw input:checked + .track .thumb { transform: translateX(16px); }
    input, textarea, select, button { font: inherit; }
    input, select, textarea { padding: .15rem .35rem; }
    textarea { width: 100%; min-height: 3.2rem; }
    button { margin-top: .25rem; padding: .2rem .55rem; }
    img { width: min(100%, 220px); height: auto; background: #fff; }
    .row { display: flex; gap: .4rem; }
    .row label { flex: 1; }
    .err { color: #8d1d1d; margin: .15rem 0; }
    .live { display: flex; gap: .6rem; }
  </style>
</head>
<body>
  {% if not authed %}
    <h1>出題を作る</h1>
    <form id="unlock">
      <label>管理パスワード<input id="password" type="password" required></label>
      <button type="submit">開く</button>
      <p class="err" id="err"></p>
    </form>
    <script>
      document.getElementById("unlock").onsubmit = async (event) => {
        event.preventDefault();
        const res = await fetch("/rec/admin/unlock", {
          method: "POST",
          headers: {"Content-Type": "application/json", "X-Speech-Rec-Request": "1"},
          body: JSON.stringify({password: document.getElementById("password").value}),
        });
        if (!res.ok) { document.getElementById("err").textContent = "パスワードが違います。"; return; }
        location.reload();
      };
    </script>
  {% else %}
    <h1>出題を作る</h1>
    <form id="make" class="box">
      <label class="sw"><input id="enabled" type="checkbox" role="switch" {% if settings.student_enabled %}checked{% endif %}><span class="track"><span class="thumb"></span></span>生徒に公開する</label>
      <label class="sw"><input id="id-on" type="checkbox" role="switch" {% if settings.id_fields.enabled %}checked{% endif %}><span class="track"><span class="thumb"></span></span>学年・クラス・番号を聞く</label>
      <label>お題（英文）<textarea id="text" required></textarea></label>
      <div class="row">
        <label>準備（秒）<input id="prep" type="number" value="60" min="10" max="180"></label>
        <label>発話（秒）<input id="speak" type="number" value="60" min="10" max="180"></label>
      </div>
      <div class="row">
        <label>有効期限
          <select id="ttl"><option value="3">3時間</option><option value="24" selected>24時間</option><option value="168">7日</option></select>
        </label>
        <label>提出上限<input id="limit" type="number" value="40" min="1" max="200"></label>
      </div>
      <label>メモ（生徒には出ません）<input id="label" placeholder="1年3組"></label>
      <button type="submit">QRを作る</button>
      <p class="err" id="err"></p>
    </form>
    <div id="out"></div>
    <script src="{{ url_for('static', filename='speech_rec/teacher.js') }}?v=2"></script>
  {% endif %}
</body>
</html>
