<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出題</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem auto; max-width: 40rem; padding: 0 1rem; color: #1c1915; }
    label { display: block; margin: .8rem 0 .3rem; }
    input, textarea, select, button { font: inherit; width: 100%; padding: .45rem .55rem; }
    textarea { min-height: 6rem; }
    button { width: auto; margin-top: .8rem; }
    img { width: min(100%, 420px); height: auto; background: #fff; }
    .row { display: flex; gap: .8rem; }
    .row label { flex: 1; }
    .err { color: #8d1d1d; }
    .live { display: flex; gap: 1rem; }
  </style>
</head>
<body>
  {% if not authed %}
    <h1>出題を作る</h1>
    <form id="unlock">
      <label>管理パスワード<input id="password" type="password" required></label>
      <button type="submit">開く</button>
      <p class="err" id="err"></p>
    </form>
    <script>
      document.getElementById("unlock").onsubmit = async (event) => {
        event.preventDefault();
        const res = await fetch("/rec/admin/unlock", {
          method: "POST",
          headers: {"Content-Type": "application/json", "X-Speech-Rec-Request": "1"},
          body: JSON.stringify({password: document.getElementById("password").value}),
        });
        if (!res.ok) { document.getElementById("err").textContent = "パスワードが違います。"; return; }
        location.reload();
      };
    </script>
  {% else %}
    <h1>出題を作る</h1>
    <p>
      <label><input id="enabled" type="checkbox" {% if settings.student_enabled %}checked{% endif %}> 生徒に公開する</label>
      <label><input id="id-on" type="checkbox" {% if settings.id_fields.enabled %}checked{% endif %}> 学年・クラス・番号を聞く</label>
    </p>
    <form id="make">
      <label>お題（英文）<textarea id="text" required></textarea></label>
      <div class="row">
        <label>準備（秒）<input id="prep" type="number" value="60" min="10" max="180"></label>
        <label>発話（秒）<input id="speak" type="number" value="60" min="10" max="180"></label>
      </div>
      <div class="row">
        <label>有効期限
          <select id="ttl"><option value="3">3時間</option><option value="24" selected>24時間</option><option value="168">7日</option></select>
        </label>
        <label>提出上限<input id="limit" type="number" value="40" min="1" max="200"></label>
      </div>
      <label>メモ（生徒には出ません）<input id="label" placeholder="1年3組"></label>
      <button type="submit">QRを作る</button>
      <p class="err" id="err"></p>
    </form>
    <div id="out"></div>
    <script src="{{ url_for('static', filename='speech_rec/teacher.js') }}?v=1"></script>
  {% endif %}
</body>
</html>
